apiVersion: v1
kind: Service
metadata:
  name: devops-api
  labels:
    app: devops-api
    tenant: {{ .Values.tenant.name }}
    environment: {{ .Values.tenant.environment }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: devops-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
